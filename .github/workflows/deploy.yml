# Build Astro + mise en ligne FTP sur l'hébergement (Namecheap) à chaque push sur main.
# Secrets à créer dans GitHub → Settings → Secrets and variables → Actions :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (et FTP_DIR si le site n'est pas dans public_html/)
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pas de secrets FTP, mise en ligne ignorée (build vérifié seulement)
        if: env.HAS_FTP != 'true'
        run: echo "Ajoutez FTP_SERVER, FTP_USERNAME, FTP_PASSWORD dans les secrets pour activer la mise en ligne."
      - name: Dossier FTP (ajoute le / final si absent)
        if: env.HAS_FTP == 'true'
        env:
          RAW_DIR: ${{ secrets.FTP_DIR }}
        run: |
          d="${RAW_DIR:-public_html/}"
          case "$d" in */) ;; *) d="$d/";; esac
          echo "FTP_DIR_FIXED=$d" >> "$GITHUB_ENV"
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.HAS_FTP == 'true'
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ env.FTP_DIR_FIXED }}
